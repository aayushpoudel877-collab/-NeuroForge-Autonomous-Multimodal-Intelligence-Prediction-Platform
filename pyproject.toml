[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="neuroforge"
version="0.1.0"
description="Autonomous multimodal intelligence and prediction platform"
requires-python=">=3.11"
dependencies=["fastapi>=0.115","uvicorn[standard]>=0.30","pydantic>=2.8","numpy>=1.26","pandas>=2.2","scikit-learn>=1.5","pillow>=10.4","pyyaml>=6.0"]
[project.optional-dependencies]
dev=["pytest>=8.3","ruff>=0.6"]
ml=["torch>=2.4"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
[tool.ruff]
line-length=100
target-version="py311"
